version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: urban-gis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis_password}
      POSTGRES_DB: ${POSTGRES_DB:-gis_db}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/spatial-indexes.sql:/docker-entrypoint-initdb.d/02-spatial-indexes.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis_user} -d ${POSTGRES_DB:-gis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gis-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: urban-gis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - gis-network

  # GeoServer
  geoserver:
    image: geosolutionsit/geoserver:2.23.x
    container_name: urban-gis-server
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_JAVA_OPTS: "-Xms512m -Xmx2g -Duser.timezone=UTC"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban-gis-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis_user}:${POSTGRES_PASSWORD:-gis_password}@postgres:5432/${POSTGRES_DB:-gis_db}
      BACKEND_PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this_in_production_12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GEOSERVER_URL: ${GEOSERVER_URL:-http://geoserver:8080/geoserver}
      GEOSERVER_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_PASS: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_started
    networks:
      - gis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban-gis-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      REACT_APP_GEOSERVER_URL: ${REACT_APP_GEOSERVER_URL:-http://localhost:8080/geoserver}
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gis-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  geoserver_data:
    driver: local

networks:
  gis-network:
    driver: bridge
